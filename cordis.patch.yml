# Bundle patch for @local/dsh-skill-plugins.
#
# This inserts one Host row. Override it by id from the profile's own
# cordis.patch.yml; a matching override replaces the complete `config`,
# so restate every field you still want.
- insert:
    - id: skill-plugins
      name: '@local/dsh-skill-plugins'
      config:
        repository: https://github.com/toxicgozen/skills.git
        ref: main
        # Full plugin directory name as the skill-name prefix:
        # plugins/gozen-stack/skills/code-review -> gozen-stack-code-review
        namespace: plugin
        # `auto` uses the system TLS backend and only retries with OpenSSL when
        # Git reports the schannel SEC_E_NO_CREDENTIALS failure. That failure is
        # a sandbox artifact, not a host one: the plugin runs in the Host
        # process, so the ordinary backend is expected to work here.
        sslBackend: auto
        syncOnApply: true
        syncIntervalMinutes: 60
